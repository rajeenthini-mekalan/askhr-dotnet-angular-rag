<header class="topbar">
  <a class="brand" routerLink="/">AskHR</a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    @if (isHrAdmin()) {
      <a routerLink="/documents" routerLinkActive="active" data-testid="nav-documents">Documents</a>
    }
  </nav>
  <span class="spacer"></span>
  @if (auth.user(); as user) {
    <span class="user">{{ user.username }}</span>
    <button type="button" (click)="auth.logout()">Sign out</button>
  } @else {
    <button type="button" (click)="auth.login()">Sign in</button>
  }
</header>

<main>
  <router-outlet />
</main>
